<!--
  Bulan vertical lockup — the crescent above, the wordmark beneath.

  Composed from the client's two supplied sources rather than drawn as a third
  mark, on the client's instruction of 2 August 2026: stack the existing
  logomark and wordmark vertically instead of introducing a distinct vertical
  logo file. Neither source is redrawn or recomposed here — each is placed
  whole, at its own proportions, and only scaled and positioned.

    logomark  bulan_logomark.svg   1063 x 1140, warm gradient
    wordmark  bulan_wordmark.svg   1883 x  509, textPrimary #F4EDE2

  Layout, in this file's own 520 x 512 space. The proportions are MEASURED off
  the client's own splash board, "S0 — Splash", not chosen here: the crescent
  is a little under half the wordmark's width, and the gap between them is
  about a third of the wordmark's width. An earlier version of this file made
  the crescent nearly as wide as the wordmark, which read as a different mark
  entirely.

    crescent  254 tall (scale 0.222807), centred on the wordmark's width
    gap       117
    wordmark  520 wide (scale 0.276155), the widest element, so it sets the
              canvas width and both elements share one centre line

  The gradient keeps gradientUnits="userSpaceOnUse", so its coordinates are
  read in the transformed space of the group that carries it and it travels
  with the crescent rather than needing to be recomputed for this canvas.

  This is the centred treatment the creative brief reserves for screens with a
  centred logo. The horizontal wordmark, bulan_logo_horiz.svg, remains final
  and unchanged for its own corner role and must not be substituted for this.
-->
<svg width="100%" height="100%" viewBox="0 0 520 512" version="1.1"
     xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bulanVertCrescent" x1="0" y1="564.79" x2="1059.02" y2="564.79"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4D4A9"/>
      <stop offset="1" stop-color="#EBA35F"/>
    </linearGradient>
  </defs>

  <g transform="translate(141.55,0) scale(0.222807)">
