---
name: Build - Linux AppImage
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup environment
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.4.313-jammy.list https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-jammy.list
          sudo apt update
          # libxcb-cursor0 is required by Qt's xcb platform plugin from 6.5
          # onwards. Qt 6.2, which this job used to install from apt, did not
          # need it, so it was never in this list; linuxdeploy's qt plugin now
          # fails to resolve it when bundling.
          sudo apt install -y libxcb-cursor0 python3-pip nasm libgbm-dev libdrm-dev libfreetype-dev libasound2-dev \
            libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev libibus-1.0-dev libpulse-dev libudev-dev libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxss-dev libxt-dev libxv-dev libxxf86vm-dev libxcb-dri3-dev libx11-xcb-dev \
            libxfixes-dev libxtst-dev wayland-protocols libopus-dev libvdpau-dev libgl-dev libpipewire-0.3-dev liburing-dev vulkan-sdk cmake
          sudo pip3 install meson aqtinstall
          mkdir -p dep_root/{bin,include,lib}
          echo "DEP_ROOT=$PWD/dep_root" >> "${GITHUB_ENV}"
          echo "$PWD/dep_root/bin" >> "${GITHUB_PATH}"

      # Qt comes from aqtinstall, not from apt.
      #
      # Bulan's interface uses MultiEffect from QtQuick.Effects, which arrived in
      # Qt 6.5. Every Ubuntu LTS ships older than that -- 22.04 has 6.2, 24.04
      # has 6.4 -- so the apt packages this job used to install cannot build the
      # app at all, and an AppImage produced against them would fail to load
      # most screens even if it linked. The Windows and macOS jobs already pull
      # a pinned Qt rather than a distro one; this now matches them.
      #
      # Pinned to the version BUILDING-WINDOWS.md and the Deck Flatpak build
      # against, so all three platforms ship the same Qt.
      - name: Install Qt
        env:
          QT_VERSION: 6.9.3
        run: |
          # No -m: qtdeclarative (which carries QtQuick.Effects since 6.5),
          # qtsvg and qtshadertools are all in the desktop base package.
          aqt install-qt linux desktop $QT_VERSION linux_gcc_64 -O "$PWD/Qt" || exit 1
          QT_BIN="$PWD/Qt/$QT_VERSION/gcc_64/bin"
          test -x "$QT_BIN/qmake" || { echo "qmake missing from $QT_BIN"; exit 1; }
          # scripts/build-appimage.sh and linuxdeploy-plugin-qt both look for
          # qmake6; the aqt package only provides qmake.
          ln -s "$QT_BIN/qmake" "$PWD/dep_root/bin/qmake6"
          echo "$QT_BIN" >> "${GITHUB_PATH}"
          echo "QMAKE=$PWD/dep_root/bin/qmake6" >> "${GITHUB_ENV}"

      - name: Checkout SDL3
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL
          ref: c9ad296376ed6091e0fdec9844461fdf09af7845
          path: deps/SDL

      - name: Build SDL3
        working-directory: deps/SDL
        run: |
          cmake -DSDL_KMSDRM=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_INSTALL_DOCS=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -S . -B build
          cmake --build build -j
          sudo cmake --install build

      - name: Checkout sdl2-compat
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/sdl2-compat
          ref: release-2.32.70
          path: deps/sdl2-compat

      - name: Build sdl2-compat
        working-directory: deps/sdl2-compat
        run: |
          cmake -DSDL2COMPAT_TESTS=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -S . -B build
          cmake --build build -j
          sudo cmake --install build

      - name: Checkout SDL_ttf
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL_ttf
          ref: a883e490e30fb44a5336ea3dcb990c6982c5216f
          path: deps/SDL_ttf
          submodules: 'recursive'

      - name: Build SDL_ttf
        working-directory: deps/SDL_ttf
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Checkout libva
        uses: actions/checkout@v5
        with:
          repository: intel/libva
          ref: 2.24.1
          path: deps/libva

      - name: Build libva
        working-directory: deps/libva
        run: |
          ./autogen.sh
          ./configure --enable-x11
          make -j$(nproc)
          sudo make install

      - name: Checkout libplacebo
        uses: actions/checkout@v5
        with:
          repository: haasn/libplacebo
          ref: 2d0979fb54e025e904c7372666fffbf5dae40f66
          path: deps/libplacebo
          submodules: 'recursive'

      - name: Build libplacebo
        working-directory: deps/libplacebo
        run: |
          git apply ../../app/deploy/linux/appimage/*.patch
          meson setup build -Dvulkan=enabled -Dopengl=disabled -Ddemos=false
          ninja -C build
          sudo ninja install -C build

      - name: Build dav1d
        working-directory: deps
        env:
          DAV1D_VER: 1.5.4
        run: |
          git clone --branch $DAV1D_VER --depth 1 https://code.videolan.org/videolan/dav1d.git
          pushd dav1d
          meson setup build -Ddefault_library=static -Dbuildtype=release -Denable_tools=false -Denable_tests=false
          ninja -C build
          sudo ninja install -C build
          popd

      - name: Checkout FFmpeg
        uses: actions/checkout@v5
        with:
          repository: FFmpeg/FFmpeg
          ref: n8.1.1
          path: deps/FFmpeg

      - name: Build FFmpeg
        working-directory: deps/FFmpeg
        run: |
          ./configure --enable-pic --enable-lto --disable-static --enable-shared --disable-all --disable-autodetect \
            --enable-avcodec --enable-avformat --enable-swscale \
            --enable-decoder=h264 --enable-decoder=hevc --enable-decoder=av1 \
            --enable-vaapi --enable-hwaccel=h264_vaapi --enable-hwaccel=hevc_vaapi --enable-hwaccel=av1_vaapi \
            --enable-vdpau --enable-hwaccel=h264_vdpau  --enable-hwaccel=hevc_vdpau --enable-hwaccel=av1_vdpau \
            --enable-libdrm --enable-vulkan --enable-hwaccel=h264_vulkan --enable-hwaccel=hevc_vulkan --enable-hwaccel=av1_vulkan \
            --enable-libdav1d --enable-decoder=libdav1d
          make -j$(nproc)
          sudo make install

      - name: Install linuxdeploy
        working-directory: dep_root/bin
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build Binaries
        run: |
          sudo ldconfig
          set -o pipefail
          if scripts/build-appimage.sh 2>&1 | tee /tmp/build.log; then
            exit 0
          fi
          # Surface the failure as ONE annotation. Job logs need an
          # authenticated token to read, but annotations are on the public REST
          # API, so this is what makes a red build diagnosable from outside.
          # It has to be a single annotation with encoded newlines rather than
          # one per line, because GitHub keeps only the first 10 per job.
          # ponytail: diagnostic scaffolding, delete once this job is green.
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{ printf "%s%%0A", $0 }'; }
          echo "::error::TAIL40 %0A$(tail -n 40 /tmp/build.log | enc)"
          echo "::error::HITS %0A$(grep -inE 'error|Error [0-9]|Killed|out of memory|virtual memory exhausted|internal compiler|undefined reference|No rule|No such file' /tmp/build.log | tail -n 20 | enc)"
          # LTO linking this project on a 7GB runner is a plausible way to die
          # with no compiler diagnostic at all, so rule the OOM killer in or out
          # rather than inferring it from silence.
          echo "::error::OOM %0A$(sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory' | tail -n 5 | enc)"
          exit 1

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-LinuxAppImage-${{ env.CI_VERSION }}
          path: build/installer-release/Moonlight-${{ env.CI_VERSION }}-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error
